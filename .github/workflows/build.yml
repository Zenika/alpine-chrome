---

name: build
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '25 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    uses: ./.github/workflows/build-one.yml
    with:
      folder: .
      tag: latest

  build-with-node:
    needs:
      - build-base
    uses: ./.github/workflows/build-one.yml
    with:
      folder: with-node
      tag: with-node
      parent: latest

  build-with-deno:
    needs:
      - build-base
    uses: ./.github/workflows/build-one.yml
    with:
      folder: with-deno
      tag: with-deno
      parent: latest

  build-with-chromedriver:
    needs:
      - build-base
    uses: ./.github/workflows/build-one.yml
    with:
      folder: with-chromedriver
      tag: with-chromedriver
      parent: latest

  build-with-playwright:
    needs:
      - build-with-node
    uses: ./.github/workflows/build-one.yml
    with:
      folder: with-playwright
      tag: with-playwright
      parent: with-node

  build-with-puppeteer:
    needs:
      - build-with-node
    uses: ./.github/workflows/build-one.yml
    with:
      folder: with-puppeteer
      tag: with-puppeteer
      parent: with-node

  build-with-puppeteer-xvfb:
    needs:
      - build-with-puppeteer
    uses: ./.github/workflows/build-one.yml
    with:
      folder: with-puppeteer-xvfb
      tag: with-puppeteer-xvfb
      parent: with-puppeteer

  build-with-selenoid:
    needs:
      - build-with-chromedriver
    uses: ./.github/workflows/build-one.yml
    with:
      folder: with-selenoid
      tag: with-selenoid
      parent: with-chromedriver
